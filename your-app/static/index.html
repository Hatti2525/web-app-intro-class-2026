<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Games App</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <!-- ヘッダー -->
    <header class="header">
      <h1>Game Library</h1>
    </header>

    <!-- メインコンテンツ -->
    <main class="Games-card">
      <!-- エラーメッセージ表示エリア -->
      <div id="error-message" class="error-message" style="display: none"></div>

      <!-- Games入力エリア -->
      <form id="Games-form" class="input-area">
        <input
          type="text"
          id="Games-input"
          class="Games-input"
          placeholder="新しいGamesを入力..."
          maxlength="100"
          autocomplete="off"
        />
        <input
    type="text"
    id="Genre-input"
    class="Games-input"
    placeholder="ジャンル（例: RPG）"
    maxlength="50"
    autocomplete="off"
  />
        <button type="submit" class="Games-button">追加</button>
      </form>

      <!-- Gamesリスト -->
      <ul id="Games-list" class="Games-list"></ul>
    </main>

    <!-- フッター -->
    <footer class="footer">
      <p>&copy; 2026 Games App</p>
    </footer>

    <script src="/app.js"></script>
  </body>
</html>
